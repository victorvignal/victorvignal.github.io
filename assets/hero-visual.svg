<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <!--
    Visual abstrato do hero
    Geometria angular inspirado na logo
  -->
  <!-- linhas diagonais radiando -->
  <g stroke="currentColor" stroke-width="1" opacity="0.15">
    <line x1="0" y1="0" x2="600" y2="600"/>
    <line x1="600" y1="0" x2="0" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>
  <!-- losangos em camadas -->
  <polygon points="300,80 480,300 300,520 120,300" fill="currentColor" opacity="0.04"/>
  <polygon points="300,140 420,300 300,460 180,300" fill="currentColor" opacity="0.06"/>
  <polygon points="300,200 360,300 300,400 240,300" fill="currentColor" opacity="0.10"/>
  <!-- V duplo central (a logo em tamanho gigante) -->
  <polygon points="190,210 110,300 300,250 490,300 410,210 290,260" fill="currentColor" opacity="0.85"/>
  <!-- diamante sólido -->
  <polygon points="300,260 332,300 300,340 268,300" fill="currentColor"/>
  <!-- Tag de notificação (chat) -->
  <g transform="translate(380, 180)">
    <rect width="140" height="56" rx="6" fill="currentColor"/>
    <text x="14" y="22" fill="#fafafa" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="600" letter-spacing="1">WHATSAPP · IA</text>
    <text x="14" y="42" fill="#fafafa" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="500" opacity="0.85">resposta em 8s</text>
  </g>
  <!-- linhas de chat entrando -->
  <g stroke="currentColor" stroke-width="1.5" opacity="0.2" stroke-dasharray="3 4">
    <path d="M 200 220 Q 280 230 380 220"/>
    <path d="M 220 260 Q 290 270 380 250"/>
  </g>
</svg>