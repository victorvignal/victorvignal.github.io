<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="currentColor" aria-label="Victor Automação IA">
  <!-- V esquerdo: parte do canto superior esquerdo, desce até o centro -->
  <polygon points="50,30 30,80 230,160 250,120"/>
  <!-- V direito: simétrico -->
  <polygon points="450,30 470,80 270,160 250,120"/>
  <!-- Diamante central (verde accent) -->
  <polygon points="250,135 275,170 250,205 225,170" fill="#25d366"/>
  <!-- Trapézio esquerdo: angular com base larga -->
  <polygon points="30,225 230,225 200,275 10,275"/>
  <!-- Trapézio direito: simétrico -->
  <polygon points="470,225 270,225 300,275 490,275"/>
</svg>