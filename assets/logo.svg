<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-label="Victor Automação IA">
  <!-- Logo Victor: dois triângulos sobrepostos formando diamante -->
  <!-- Triângulo superior (preto, ponta em cima) -->
  <polygon points="50,12 14,55 86,55"/>
  <!-- Triângulo inferior (cinza, sombra, ponta em baixo) -->
  <polygon points="50,88 14,45 86,45" opacity="0.55"/>
</svg>