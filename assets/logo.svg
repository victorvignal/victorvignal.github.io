<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor">
  <!--
    Logo Victor Automação IA
    Dois V invertidos + diamante central
    - viewBox 100x100: cantos em (0,0) e (100,100)
    - "fills" assumem cor do elemento pai (currentColor)
  -->
  <!-- V esquerdo + direito (CANCELAS do "K deitado") -->
  <polygon points="14,18 6,32 38,38 50,28"/>
  <polygon points="86,18 94,32 62,38 50,28"/>
  <!-- Triangulo central inferior -->
  <polygon points="50,50 32,82 68,82"/>
  <!-- Diamante (losango) bem visível no centro -->
  <polygon points="50,42 58,52 50,62 42,52"/>
</svg>